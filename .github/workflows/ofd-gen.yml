name: OF-B Sample Generation

on:
  schedule:
    # 每周日 02:00 UTC 运行（JDK 环境可用时生成新样本）
    - cron: "0 2 * * 0"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  generate:
    name: Generate OFD samples with ofdrw
    runs-on: ubuntu-latest
    # JDK 环境可用，可执行完整生成流程
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Maven
        uses: actions/setup-maven@v4
        with:
          maven-version: "3.9"

      - name: Generate samples
        run: bash scripts/ofd_sample_gen.sh 2>&1 | tail -30

      - name: Count generated samples
        run: |
          echo "Generated samples:"
          ls -la tests/fixtures/ofdrw_gen/*.ofd 2>/dev/null || echo "(none)"
          echo "Count: $(ls tests/fixtures/ofdrw_gen/*.ofd 2>/dev/null | wc -l)"

      - name: Upload samples as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofdrw-gen-samples
          path: tests/fixtures/ofdrw_gen/*.ofd
          retention-days: 90
          if-no-files-found: warn

  verify:
    name: Verify generated samples (Rust)
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Download generated samples
        uses: actions/download-artifact@v4
        with:
          name: ofdrw-gen-samples
          path: tests/fixtures/ofdrw_gen/

      - name: Run conformance tests
        run: cargo test --test ofdrw_gen_conformance 2>&1 | tail -20
        continue-on-error: true # 生成样本不阻断 CI

      - name: Clippy check
        run: cargo clippy -p easyofd --all-targets -- -D warnings
