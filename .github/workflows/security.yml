name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Dependency contract
        run: python3 scripts/check_dependency_contract.py

      - name: Fresh consumer dependency resolution
        run: python3 scripts/check_fresh_resolution.py

      - name: Unfiltered cargo audit (production and fuzz)
        shell: bash
        run: |
          audit_workspace=$(mktemp -d)
          trap 'rm -rf "$audit_workspace"' EXIT
          cd "$audit_workspace"
          cargo audit --db "$audit_workspace/advisory-db" --file "$GITHUB_WORKSPACE/Cargo.lock" --deny warnings
          cargo audit --db "$audit_workspace/advisory-db" --file "$GITHUB_WORKSPACE/fuzz/Cargo.lock" --deny warnings

      - name: cargo deny check
        run: cargo deny check
