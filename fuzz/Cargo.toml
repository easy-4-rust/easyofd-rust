[package]
name = "easyofd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
easyofd-core = { path = "../crates/easyofd-core" }
easyofd-reader = { path = "../crates/easyofd-reader" }
easyofd-gm = { path = "../crates/easyofd-gm" }
lopdf = "0.35"

# 防止被根 workspace 探测到：独立 workspace
[[bin]]
name = "fuzz_xml"
path = "fuzz_targets/fuzz_xml.rs"

[[bin]]
name = "fuzz_ofd_reader"
path = "fuzz_targets/fuzz_ofd_reader.rs"

[[bin]]
name = "fuzz_ses_der"
path = "fuzz_targets/fuzz_ses_der.rs"

[[bin]]
name = "fuzz_pdf"
path = "fuzz_targets/fuzz_pdf.rs"

[workspace]
