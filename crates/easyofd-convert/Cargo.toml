[package]
name = "easyofd-convert"
description = "PDF ↔ OFD bidirectional conversion for easyofd-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
easyofd-core = { workspace = true }
easyofd-font = { workspace = true }
easyofd-reader = { workspace = true }
easyofd-writer = { workspace = true }
lopdf = { workspace = true }
printpdf = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
ttf-parser = { workspace = true }
image = { workspace = true }
fontdue = { workspace = true }
tiny-skia = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
manual_string_new = "allow"
uninlined_format_args = "allow"
needless_range_loop = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
format_push_string = "allow"
