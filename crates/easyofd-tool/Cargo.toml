[package]
name = "easyofd-tool"
description = "CLI tool for OFD document operations (info, convert, sign, verify) and merge utilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "easyofd_tool"
path = "src/lib.rs"

[[bin]]
name = "easyofd"
path = "src/main.rs"

[dependencies]
easyofd = { workspace = true }
easyofd-core = { workspace = true }
easyofd-reader = { workspace = true }
easyofd-writer = { workspace = true }
clap = { workspace = true }
sm3 = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
