[workspace]
resolver = "3"
members = [
    "crates/easyofd-convert",
    "crates/easyofd-core",
    "crates/easyofd-derive",
    "crates/easyofd-derive-impl",
    "crates/easyofd-layout",
    "crates/easyofd-markdown",
    "crates/easyofd-package",
    "crates/easyofd-reader",
    "crates/easyofd-signature",
    "crates/easyofd-template",
    "crates/easyofd-writer",
    "crates/easyofd",
    # ── ofdrw 对齐新增 crate ──
    "crates/easyofd-gm",
    "crates/easyofd-archive",
    "crates/easyofd-crypto",
    "crates/easyofd-graphics2d",
    "crates/easyofd-font",
    "crates/easyofd-tool",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/easy-4-rust/easyofd-rust"
description = "A Rust library for easy OFD (Open Fixed-layout Document) operations, inspired by EasyExcel"
keywords = ["ofd", "document", "writer", "reader", "easyofd"]
categories = ["encoding", "parser"]

[workspace.dependencies]
easyofd-core = { path = "crates/easyofd-core" , version = "1.0.0" }
easyofd-convert = { path = "crates/easyofd-convert" , version = "1.0.0" }
easyofd-derive = { path = "crates/easyofd-derive" , version = "1.0.0" }
easyofd-derive-impl = { path = "crates/easyofd-derive-impl" , version = "1.0.0" }
easyofd-layout = { path = "crates/easyofd-layout" , version = "1.0.0" }
easyofd-markdown = { path = "crates/easyofd-markdown" , version = "1.0.0" }
easyofd-package = { path = "crates/easyofd-package" , version = "1.0.0" }
easyofd-reader = { path = "crates/easyofd-reader" , version = "1.0.0" }
easyofd-signature = { path = "crates/easyofd-signature" , version = "1.0.0" }
easyofd-template = { path = "crates/easyofd-template" , version = "1.0.0" }
easyofd-writer = { path = "crates/easyofd-writer" , version = "1.0.0" }
easyofd = { path = "crates/easyofd" , version = "1.0.0" }
easyofd-gm = { path = "crates/easyofd-gm" , version = "1.0.0" }
easyofd-archive = { path = "crates/easyofd-archive" , version = "1.0.0" }
easyofd-crypto = { path = "crates/easyofd-crypto" , version = "1.0.0" }
easyofd-graphics2d = { path = "crates/easyofd-graphics2d" , version = "1.0.0" }
easyofd-font = { path = "crates/easyofd-font" , version = "1.0.0" }
easyofd-tool = { path = "crates/easyofd-tool" , version = "1.0.0" }

clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0.18"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }
trybuild = "1.0.116"
criterion = { version = "0.5", features = ["html_reports"] }
# ═══ 国密算法 ═══
sm2 = { version = "0.14.0-rc.15", features = ["dsa", "arithmetic", "getrandom"] }
sm3 = "0.5.0"
sha2 = "0.10.9"
der = "0.8.1"
x509-cert = "0.3.0"
pem = "4.0.0"
lopdf = "0.35"
printpdf = { version = "0.7", default-features = false, features = ["font_subsetting"] }
# ═══ 转换渲染（AWTMaker/PDF 替换，纯 Rust）═══
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9.4"
tiny-skia = "0.12.0"
# ═══ PKCS#12 解密（PBES2/PBKDF2，纯 Rust）═══
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.11"
sm4 = "0.5"
ttf-parser = "0.21"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
unnecessary_wraps = "allow"
redundant_closure_for_method_calls = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
semicolon_if_nothing_returned = "allow"
collapsible_if = "allow"
needless_pass_by_value = "allow"
missing_panics_doc = "allow"
unnecessary_map_or = "allow"
missing_errors_doc = "allow"
items_after_statements = "allow"
manual_string_new = "allow"
