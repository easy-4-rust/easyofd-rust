[workspace]
resolver = "3"
members = [
    "crates/easyofd-convert",
    "crates/easyofd-core",
    "crates/easyofd-derive",
    "crates/easyofd-derive-impl",
    "crates/easyofd-layout",
    "crates/easyofd-markdown",
    "crates/easyofd-package",
    "crates/easyofd-reader",
    "crates/easyofd-signature",
    "crates/easyofd-template",
    "crates/easyofd-writer",
    "crates/easyofd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/easy-4-rust/easyofd-rust"
description = "A Rust library for easy OFD (Open Fixed-layout Document) operations, inspired by EasyExcel"
keywords = ["ofd", "document", "writer", "reader", "easyofd"]
categories = ["encoding", "parser"]

[workspace.dependencies]
easyofd-core = { path = "crates/easyofd-core" , version = "0.1.0" }
easyofd-convert = { path = "crates/easyofd-convert" , version = "0.1.0" }
easyofd-derive = { path = "crates/easyofd-derive" , version = "0.1.0" }
easyofd-derive-impl = { path = "crates/easyofd-derive-impl" , version = "0.1.0" }
easyofd-layout = { path = "crates/easyofd-layout" , version = "0.1.0" }
easyofd-markdown = { path = "crates/easyofd-markdown" , version = "0.1.0" }
easyofd-package = { path = "crates/easyofd-package" , version = "0.1.0" }
easyofd-reader = { path = "crates/easyofd-reader" , version = "0.1.0" }
easyofd-signature = { path = "crates/easyofd-signature" , version = "0.1.0" }
easyofd-template = { path = "crates/easyofd-template" , version = "0.1.0" }
easyofd-writer = { path = "crates/easyofd-writer" , version = "0.1.0" }
easyofd = { path = "crates/easyofd" , version = "0.1.0" }

thiserror = "2.0.18"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }
trybuild = "1.0.116"
criterion = { version = "0.5", features = ["html_reports"] }
# ═══ 国密算法 ═══
sm2 = { version = "0.14.0-rc.15", features = ["dsa", "arithmetic", "getrandom"] }
sm3 = "0.5.0"
lopdf = "0.35"
printpdf = "0.7"
rand = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
unnecessary_wraps = "allow"
redundant_closure_for_method_calls = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
semicolon_if_nothing_returned = "allow"
collapsible_if = "allow"
needless_pass_by_value = "allow"
missing_panics_doc = "allow"
unnecessary_map_or = "allow"
missing_errors_doc = "allow"
items_after_statements = "allow"
manual_string_new = "allow"


[workspace.dev-dependencies]
criterion = { workspace = true }
