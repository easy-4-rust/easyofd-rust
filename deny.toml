# cargo-deny configuration for easyofd-rust
# https://EmbarkStudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# 无豁免：漏洞、停止维护与撤回版本必须移除。
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    # 渲染/PDF：printpdf (MPL-2.0)、ttf-parser (MIT/Apache)
    "MPL-2.0",
    # 国密算法：sm2/sm3 系列 (Apache-2.0/MIT)
    # 构建工具：criterion/trybuild/syn 等 (MIT/Apache-2.0)
]
confidence-threshold = 0.8

[bans]
# "warn" 因为传递依赖（如 criterion -> wasm-bindgen -> syn 2.x
# 与直接依赖 syn 3.x）可能合法地引入多个版本。
multiple-versions = "warn"
# "warn" 因为 workspace 内部 path 依赖会被 cargo-deny 视为 wildcard；
# 这是 workspace 内部 crate 的正常现象。
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
